version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: starfish-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - starfish-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: starfish-backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/starfish
      # OPENAI_API_KEY는 .env 파일에서 가져옵니다. 주의!! 
      # 배포 시 Railway, AWS 등에 직접 키를 환경변수로 주입해야 합니다.
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - starfish-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: starfish-frontend
    ports:
      - "80:80"
    networks:
      - starfish-network

volumes:
  mongodb_data:

networks:
  starfish-network:
    driver: bridge
